name: CI-CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

env:
  POSTGRES_USER: hotel_admin
  POSTGRES_PASSWORD: secretpassword
  POSTGRES_DB: hotel_db
  IMAGE_TAG: ${{ github.sha }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and run pip-audit
        run: |
          pip install pytest requests pip-audit
          pip-audit -r auth-service/requirements.txt || true
          pip-audit -r backend/requirements.txt || true

      - name: Build images with Git SHA
        run: |
          docker build -t hotel-auth-service:${{ github.sha }} -t hotel-auth-service:latest ./auth-service
          docker build -t hotel-backend:${{ github.sha }} -t hotel-backend:latest ./backend
          docker build -t hotel-gateway:${{ github.sha }} -t hotel-gateway:latest ./gateway

      - name: Trivy config and image scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          hide-progress: true
          exit-code: "0"

      - name: Start stack and run Pytest
        run: |
          docker swarm init --advertise-addr 127.0.0.1 || true
          docker compose up -d
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/login || true)
            if [ "$CODE" = "200" ]; then
              pytest tests/test_api.py -v
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Stop containers
        if: always()
        run: |
          docker compose down -v --remove-orphans || true

      - name: SSH Production Deploy
        if: github.ref == 'refs/heads/main' && env.PROD_HOST != ''
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/hotel-app
            git pull origin main
            IMAGE_TAG=${{ github.sha }} docker stack deploy --resolve-image=never -c compose.yaml hotel_cluster