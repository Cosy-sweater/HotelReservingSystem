name: Hotel System CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env file for testing
        run: |
          docker swarm init
          echo "POSTGRES_USER=hotel_admin" >> .env
          echo "POSTGRES_PASSWORD=test_secret_password" >> .env
          echo "POSTGRES_DB=hotel_db" >> .env
          echo "IMAGE_TAG=ci-test" >> .env

      - name: Build Docker images
        run: |
          docker swarm init
          docker build -t hotel-auth-service:latest ./auth-service
          docker build -t hotel-backend:latest ./backend
          docker build -t hotel-gateway:latest ./gateway

      - name: Start multi-container application
        run: docker compose up -d

      - name: Wait for gateway and services to be ready
        run: |
          docker swarm init
          for i in {1..30}; do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/ | grep -qE "200|302"; then
              echo "Gateway is up and responding!"
              break
            fi
            echo "Waiting for services... ($i/30)"
            sleep 2
          done

      - name: Run API and Auth integration tests
        run: |
          docker swarm init
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/login.html)
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Login page failed with status $HTTP_STATUS"
            exit 1
          fi

          # Проверка защиты закрытого API от неавторизованных запросов
          API_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/rooms)
          if [ "$API_STATUS" -ne 401 ] && [ "$API_STATUS" -ne 403 ] && [ "$API_STATUS" -ne 302 ]; then
            echo "Unauthorized access check failed with status $API_STATUS"
            exit 1
          fi

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop and remove containers
        if: always()
        run: docker compose down -v --remove-orphans