name: CI-CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

env:
  POSTGRES_USER: hotel_admin
  POSTGRES_PASSWORD: secretpassword
  POSTGRES_DB: hotel_db
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools and check dependencies
        run: |
          pip install flake8 pip-audit pytest requests
          pip install -r auth-service/requirements.txt
          pip install -r backend/requirements.txt
          flake8 auth-service/ backend/ --select=E9,F63,F7,F82
          pip-audit -r auth-service/requirements.txt || true
          pip-audit -r backend/requirements.txt || true

      - name: Build Docker images with Git SHA
        run: |
          docker build -t hotel-auth-service:${{ github.sha }} -t hotel-auth-service:latest ./auth-service
          docker build -t hotel-backend:${{ github.sha }} -t hotel-backend:latest ./backend
          docker build -t hotel-gateway:${{ github.sha }} -t hotel-gateway:latest ./gateway

      - name: Scan Docker config and image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          hide-progress: true
          exit-code: "0"

      - name: Scan backend image vulnerabilities with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: hotel-backend:${{ github.sha }}
          hide-progress: true
          exit-code: "0"
          severity: CRITICAL,HIGH

      - name: Start services and run Pytest
        run: |
          docker compose up -d
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/login || true)
            if [ "$STATUS" = "200" ]; then
              pytest tests/test_api.py -v
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Tear down test containers
        if: always()
        run: |
          docker compose down -v --remove-orphans

      - name: Deploy to Production via SSH
        if: github.ref == 'refs/heads/main' && env.PROD_HOST != ''
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/hotel-app
            git pull origin main
            IMAGE_TAG=${{ github.sha }} docker stack deploy --resolve-image=never -c compose.yaml hotel_cluster