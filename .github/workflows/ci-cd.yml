name: Hotel Platform CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/hotel

jobs:
  lint-and-validate:
    name: 1. Lint & Validate Microservices
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies & Flake8
        run: |
          pip install flake8
          pip install -r auth-service/requirements.txt
          pip install -r backend/requirements.txt

      - name: Check Python syntax & critical errors
        run: |
          flake8 auth-service/ backend/ --count --select=E9,F63,F7,F82 --show-source --statistics
          python -m py_compile auth-service/app.py backend/app.py

  build-and-test-stack:
    name: 2. Build 5-Container Stack & Integration Test
    needs: lint-and-validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build all container images
        run: |
          docker build -t hotel-auth-service:latest ./auth-service
          docker build -t hotel-backend:latest ./backend
          docker build -t hotel-gateway:latest ./gateway
          docker pull postgres:16-alpine
          docker pull redis:7-alpine

      - name: Initialize Docker Swarm Cluster & Deploy Stack
        run: |
          # GitHub runners have multiple network interfaces; advertise eth0 IP
          ADVERTISE_IP=$(hostname -I | awk '{print $1}')
          docker swarm init --advertise-addr $ADVERTISE_IP
          # --resolve-image=never tells Swarm to use our local build instead of querying Docker Hub!
          docker stack deploy --resolve-image=never -c compose.yaml hotel_cluster

      - name: Run Automated Smoke Tests against Gateway (:8080)
        run: |
          echo "Waiting for Swarm cluster services and port 8080 to become ready..."
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/admin/ || true)
            if [ "$STATUS" = "302" ] || [ "$STATUS" = "401" ]; then
              echo "Success! Gateway responded with HTTP $STATUS (Unauthenticated user blocked from /admin/)"
              docker stack services hotel_cluster
              exit 0
            fi
            echo "Attempt $i/30: Gateway not ready yet (status: $STATUS), waiting 2s..."
            sleep 2
          done
          
          echo "Smoke test timed out!"
          docker stack services hotel_cluster
          docker stack ps hotel_cluster --no-trunc
          docker service logs hotel_cluster_gateway
          docker service logs hotel_cluster_auth-service
          exit 1

  deploy-production:
    name: 3. Deploy to Cluster
    needs: build-and-test-stack
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Stack to Production Swarm Manager
        run: |
          echo "Deploying verified images to Docker Swarm cluster..."
          # For remote SSH deployment in production:
          # ssh user@prod-server "cd /opt/hotel-app && git pull && docker stack deploy -c compose.yaml hotel_cluster"