name: Hotel Platform CI-CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  lint-and-audit:
    name: Lint and Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install flake8 pip-audit pytest requests
          pip install -r auth-service/requirements.txt
          pip install -r backend/requirements.txt

      - name: Run Flake8 syntax check
        run: |
          flake8 auth-service/ backend/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run pip-audit dependency scan
        run: |
          pip-audit -r auth-service/requirements.txt || true
          pip-audit -r backend/requirements.txt || true

      - name: Run Trivy configuration scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          hide-progress: true
          exit-code: "0"

  build-scan-and-test:
    name: Build Scan and Integration Test
    needs: lint-and-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python for Pytest
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          pip install pytest requests

      - name: Build Docker images with Git SHA
        run: |
          docker build -t hotel-auth-service:${{ github.sha }} ./auth-service
          docker build -t hotel-backend:${{ github.sha }} ./backend
          docker build -t hotel-gateway:${{ github.sha }} ./gateway

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: hotel-backend:${{ github.sha }}
          format: table
          hide-progress: true
          exit-code: "0"
          severity: CRITICAL,HIGH

      - name: Deploy Stack to Docker Swarm
        run: |
          ADVERTISE_IP=$(hostname -I | awk '{print $1}')
          docker swarm init --advertise-addr "$ADVERTISE_IP"
          export IMAGE_TAG="${{ github.sha }}"
          export POSTGRES_USER="hotel_admin"
          export POSTGRES_DB="hotel_db"
          export POSTGRES_PASSWORD=$(openssl rand -hex 24)
          export ADMIN_INITIAL_PASSWORD=$(openssl rand -hex 16)
          docker stack deploy --resolve-image=never -c compose.yaml hotel_cluster

      - name: Run Pytest API Integration Suite
        run: |
          for i in $(seq 1 35); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/admin/ || true)
            if [ "$STATUS" = "302" ] || [ "$STATUS" = "401" ]; then
              pytest tests/test_api.py -v
              exit 0
            fi
            sleep 2
          done
          docker stack services hotel_cluster
          docker service logs hotel_cluster_backend || true
          docker service logs hotel_cluster_auth-service || true
          exit 1

  deploy-production:
    name: Production SSH Deployment
    needs: build-scan-and-test
    if: github.ref == 'refs/heads/main' && env.PROD_HOST != ''
    runs-on: ubuntu-latest
    env:
      PROD_HOST: ${{ secrets.PROD_HOST }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/hotel-app
            git pull origin main
            export IMAGE_TAG=${{ github.sha }}
            docker build -t hotel-auth-service:${{ github.sha }} ./auth-service
            docker build -t hotel-backend:${{ github.sha }} ./backend
            docker build -t hotel-gateway:${{ github.sha }} ./gateway
            docker stack deploy --resolve-image=never -c compose.yaml hotel_cluster