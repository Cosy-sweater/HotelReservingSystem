name: Hotel Platform Secure CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  IMAGE_PREFIX: hotel

jobs:
  # 1. Code Linting, Dependency Audit & Security Check
  security-and-lint:
    name: 1. Lint, Pip-Audit & Config Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies & Security Tools
        run: |
          pip install flake8 pip-audit pytest requests
          pip install -r auth-service/requirements.txt
          pip install -r backend/requirements.txt

      - name: Check Python syntax (Flake8)
        run: flake8 auth-service/ backend/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Check Python dependencies for known vulnerabilities (Point 6 - pip-audit)
          [cite: 3]
        run: |
          pip-audit -r auth-service/requirements.txt
          pip-audit -r backend/requirements.txt

      - name: Scan Dockerfiles and configs for security issues (Point 7 - Trivy Config Analysis)
          [cite: 3]
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          hide-progress: false
          exit-code: '0' # set to 1 to fail pipeline on misconfigurations

  build-and-scan-images:
    name: 2. Build (SHA Tag) & Trivy Image Scan
    needs: security-and-lint
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.prep.out.sha_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Git Commit SHA Tag (Point 4)
          [cite: 3]
        id: prep
        run: |
          SHA_TAG="${{ github.sha }}"
          echo "sha_tag=$SHA_TAG" >> $GITHUB_OUTPUT
          echo "Building images with tag: $SHA_TAG"

      - name: Build container images with SHA tag
        run: |
          docker build -t hotel-auth-service:${{ github.sha }} ./auth-service
          docker build -t hotel-backend:${{ github.sha }} ./backend
          docker build -t hotel-gateway:${{ github.sha }} ./gateway

      - name: Scan built images for vulnerabilities with Trivy (Point 5)
          [cite: 3]
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'hotel-backend:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  integration-tests:
    name: 3. Swarm Deploy & Pytest Integration Test
    needs: build-and-scan-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize Docker Swarm & Deploy Stack
        run: |
          ADVERTISE_IP=$(hostname -I | awk '{print $1}')
          docker swarm init --advertise-addr $ADVERTISE_IP
          docker stack deploy --resolve-image=never -c compose.yaml hotel_cluster

      - name: Wait for Gateway (:8080) & Run Pytest Suite (Points 1 & 2)
          [cite: 3]
        run: |
          echo "Waiting for services to boot up..."
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/ || true)
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "302" ]; then
              echo "Gateway is active! Running pytest API test suite..."
              pytest tests/test_api.py
              exit 0
            fi
            sleep 2
          done
          echo "Integration test timeout. Container logs:"
          docker service logs hotel_cluster_backend
          exit 1

  deploy-production:
    name: 4. Production SSH Deployment
    needs: integration-tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Remote Production Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/hotel-app
            git pull origin main
            # Pull or build exact Git SHA version in production
            export IMAGE_TAG=${{ github.sha }}
            docker stack deploy --resolve-image=never -c compose.yaml hotel_cluster
            echo "Successfully deployed commit ${{ github.sha }} to production!"