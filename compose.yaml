services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hotel_admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: hotel_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel_admin -d hotel_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]

  redis:
    image: redis:7-alpine
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1

  auth-service:
    image: hotel-auth-service:latest
    build: ./auth-service
    environment:
      DB_HOST: db
      POSTGRES_USER: hotel_admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: hotel_db
      REDIS_HOST: redis
    volumes:
      - ./auth-service:/app
    networks:
      - frontend-net
      - backend-net
    depends_on:
      - db
      - redis
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 5s
      restart_policy:
        condition: on-failure

  backend:
    image: hotel-backend:latest
    build: ./backend
    environment:
      DB_HOST: db
      POSTGRES_USER: hotel_admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: hotel_db
      REDIS_HOST: redis
    volumes:
      - ./backend:/app
    networks:
      - frontend-net
      - backend-net
    depends_on:
      - db
      - redis
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 5s
      restart_policy:
        condition: on-failure

  gateway:
    image: hotel-gateway:latest
    build: ./gateway
    ports:
      - "8080:80"
    volumes:
      - ./gateway/html:/usr/share/nginx/html:ro
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend-net
    depends_on:
      - auth-service
      - backend
    deploy:
      replicas: 1

networks:
  # Public-facing internal cluster network (Gateway <-> Microservices)
  frontend-net:
    driver: overlay
    attachable: true
  # Strictly isolated data network (Microservices <-> DB/Redis; Gateway cannot access)
  backend-net:
    driver: overlay
    internal: true
    attachable: true

volumes:
  pgdata: