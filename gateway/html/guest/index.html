<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Портал снятия комнат в Отеле</title>

    <link href="../css/fonts.css" rel="stylesheet">
    <link href="../css/global.css" rel="stylesheet">
    <link href="/guest/styles/main.css" rel="stylesheet">
</head>
<body>
    <header>
        <h1 style="margin:0;">Снятие комнат в Отеле</h1>
        <div class="header-user-menu" style="">
            <span>Добро пожаловать, <b id="user-display">...</b></span>
            <a href="/admin/"><button id="admin-btn" style="display:none">Панель администратораа</button></a>
            <button class="logout-button" onclick="logout()">Выйти</button>
        </div>
    </header>
    <hr>

    <section class="filter-panel">
        <div class="filter-grid">
            <div class="filter-group">
                <label>Дата въезда</label>
                <input type="datetime-local" id="f_in" required onchange="renderRooms()" />
            </div>
            <div class="filter-group">
                <label>Дата выезда</label>
                <input type="datetime-local" id="f_out" required onchange="renderRooms()" />
            </div>
            <div class="filter-group">
                <label>Спальные места</label>
                <select id="f_beds" required onchange="renderRooms()">
                    <option value="0">Любое количество</option>
                    <option value="1">1+</option>
                    <option value="2">2+</option>
                    <option value="3">3+</option>
                    <option value="4">4+</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Цена за ночь</label>
                <input type="number" id="f_price" placeholder="Любая" min="0" oninput="renderRooms()" />
            </div>
            <div class="filter-group">
                <label>Доп. критерии</label>
                <input type="text" id="f_search" placeholder="Номер этажа / Вид..." oninput="renderRooms()" />
            </div>
            <div class="filter-group">
                <label>Сортировать по</label>
                <select id="f_sort" onchange="renderRooms()">
                    <option value="price_asc">Цена: по-возростанию</option>
                    <option value="price_desc">Цена: по-убыванию</option>
                    <option value="area_desc">Наибольшая площадь</option>
                    <option value="room_asc">Номер комнаты</option>
                </select>
            </div>
        </div>

        <div class="filter-toggles">
            <div style="display:flex; gap:18px; flex-wrap:wrap;">
                <label class="checkbox-label">
                    <input type="checkbox" id="f_pets" onchange="renderRooms()" />
                    <p>Можно с питомцами</p>
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="f_avail_only" onchange="renderRooms()" />
                    <p>Скрыть недоступные</p>
                </label>
            </div>
            <button onclick="resetFilters()">
                Сбросить фильтр
            </button>
        </div>
    </section>

    <section id="rooms-container" class="rooms-container">
        <p>Loading rooms...</p>
    </section>

    <script src="../js/common.js"></script>
    <script src="/guest/scripts/index.js"></script>
</body>
</html>
