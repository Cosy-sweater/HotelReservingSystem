<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rent Room - Hotel Portal</title>
    <link href="../css/fonts.css" rel="stylesheet">
    <link href="../css/global.css" rel="stylesheet">
    <link href="/guest/styles/room.css" rel="stylesheet">
</head>
<body>
    <a class="main-page-button" href="/">&larr; Back to Room Catalog</a>

    <div id="room-box" class="card">Loading room details...</div>

    <div class="card">
        <h3>Select Rental Dates & Times</h3>
        <div class="date-selection-container">
            <div>
                <label style="font-size:0.85rem; font-weight:600;">Check-In (Earliest Available Set Automatically)</label>
                <input type="datetime-local" id="check_in" />
            </div>
            <div>
                <label style="font-size:0.85rem; font-weight:600;">Check-Out</label>
                <input type="datetime-local" id="check_out" />
            </div>
        </div>

        <div id="action-area"></div>
        <div id="conflict-box" style="display:none; margin-top:12px; padding:12px; background:#fef2f2; border:1px solid #f87171; border-radius:6px; color:#991b1b;"></div>
    </div>

    <script src="/js/common.js"></script>
    <script src="/guest/scripts/room.js"></script>
</body>
</html>
