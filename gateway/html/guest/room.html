<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Портал бронирования Отеля - Номер</title>
    <link href="../css/fonts.css" rel="stylesheet">
    <link href="../css/global.css" rel="stylesheet">
    <link href="styles/room.css" rel="stylesheet">
</head>
<body>
<a href="/" class="main-page-button">&larr; На главную</a>

    <div id="room-box" class="card">Загрузка...</div>

    <div class="card">
        <h3>Выбор дат и времени снятия</h3>
        <div class="card-section">
            <div>
                <label>Дата въезда</label>
                <input type="datetime-local" id="check_in" />
            </div>
            <div>
                <label>Дата выезда</label>
                <input type="datetime-local" id="check_out" />
            </div>
        </div>

        <div class="estimate-bar">
            <div>
                <span>Оплата за </span>
                <b id="est-hours">1 час</b>
            </div>
            <div>
                <span>К оплате: </span><b id="est-total" style="color:#15803d;">0 RUB</b>
            </div>
        </div>

        <div id="action-area"></div>
        <div id="conflict-box" ></div>
    </div>

    <script src="/js/common.js"></script>
    <script src="scripts/room.js"></script>
</body>
</html>
