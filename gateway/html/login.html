<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Hotel Login</title>

    <link href="css/fonts.css" rel="stylesheet">
    <link href="css/global.css" rel="stylesheet">
    <link href="css/login.css" rel="stylesheet">
  </head>

  <body>
    <div class="window">
      <h2>Вход в Систему Отеля</h2>
      <div class="inputs-wrapper">
        <input id="username" placeholder="Username"/>
        <input id="password" type="password" placeholder="Password"/>
        <div class="checkbox-container">
          <input class="show-password-checkbox" type="checkbox"
                 onclick="revealPassword()">
          <p>Показать пароль</p>
        </div>
      </div>
      <div class="inputs-wrapper" id="reg-window" style="display: none">
        <input id="passport-number" type="password" placeholder="Номер паспорта"/>
        <input id="phone" placeholder="Номер телефона"/>
        <div class="checkbox-container">
        <input class="show-password-checkbox" type="checkbox"
                 onclick="revealPassport()">
          <p>Показать паспорт</p>
        </div>
      </div>
      <p class="error-message"></p>
      <div class="button-container">
        <button onclick="login()">Вход</button>
        <button onclick="register()">Регистрация</button>
      </div>
    </div>
    <script src="js/login.js"></script>
  </body>
</html>
