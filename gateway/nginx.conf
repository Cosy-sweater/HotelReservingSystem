server {
    listen 80;
    server_name localhost;

    absolute_redirect off;
    port_in_redirect off;

    # Docker embedded DNS server - prevents 502 Bad Gateway when replicas restart
    resolver 127.0.0.11 valid=5s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    # Return JSON instead of HTML if a backend microservice is still booting
    error_page 502 503 504 = @json_gateway_error;
    location @json_gateway_error {
        default_type application/json;
        return 502 '{"error": "Service is starting up or temporarily unavailable (502). Please wait a few seconds and try again."}';
    }

    # Public static assets (CSS & JS)
    location /css/ {
        try_files $uri =404;
    }

    location /js/ {
        try_files $uri =404;
    }

    # Public Login & Registration page
    location = /login {
        try_files /login.html =404;
    }

    # Internal Auth subrequest for Guest pages
    location = /_verify_user {
        internal;
        set $auth_upstream http://auth-service:5001;
        proxy_pass $auth_upstream/auth/verify-user;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    # Internal Auth subrequest for Admin pages
    location = /_verify_admin {
        internal;
        set $auth_upstream http://auth-service:5001;
        proxy_pass $auth_upstream/auth/verify-admin;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location @login_redirect {
        return 302 /login;
    }

    # Auth Service API
    location /auth/ {
        set $auth_upstream http://auth-service:5001;
        proxy_pass $auth_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
    }

    # Backend Service API
    location /api/ {
        set $backend_upstream http://backend:5000;
        proxy_pass $backend_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
    }

    # Protected Admin Portal
    location /admin/ {
        auth_request /_verify_admin;
        error_page 401 403 = @login_redirect;
        try_files $uri $uri/ /admin/index.html =404;
    }

    # Protected Guest Room Checkout Page
    location = /room {
        auth_request /_verify_user;
        error_page 401 = @login_redirect;
        try_files /guest/room.html =404;
    }

    # Protected Guest Catalog (Root)
    location / {
        auth_request /_verify_user;
        error_page 401 = @login_redirect;
        try_files /guest$uri /guest$uri/ /guest/index.html =404;
    }
}