server {
    listen 80;
    server_name localhost;

    absolute_redirect off;
    port_in_redirect off;

    resolver 127.0.0.11 valid=5s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    error_page 502 503 504 = @json_gateway_error;
    location @json_gateway_error {
        default_type application/json;
        return 502 '{"error": "Service is starting up or temporarily unavailable (502)"}';
    }

    location /css/ {
        try_files $uri =404;
    }

    location /js/ {
        try_files $uri =404;
    }

    location /login {
        try_files /login.html =404;
    }

    location /_verify_user {
        internal;
        set $auth_upstream http://auth-service:5001;
        proxy_pass $auth_upstream/auth/verify-user;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location /_verify_admin {
        internal;
        set $auth_upstream http://auth-service:5001;
        proxy_pass $auth_upstream/auth/verify-admin;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location @login_redirect {
        return 302 /login;
    }

    location /auth/ {
        set $auth_upstream http://auth-service:5001;
        proxy_pass $auth_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
    }

    location /api/ {
        set $backend_upstream http://backend:5000;
        proxy_pass $backend_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
    }

    location /admin/ {
        auth_request /_verify_admin;
        error_page 401 403 = @login_redirect;
        try_files $uri $uri/ /admin/index.html =404;
    }

    location /room {
        auth_request /_verify_user;
        error_page 401 = @login_redirect;
        try_files /guest/room.html =404;
    }

    location / {
        auth_request /_verify_user;
        error_page 401 = @login_redirect;
        try_files /guest$uri /guest$uri/ /guest/index.html =404;
    }
}