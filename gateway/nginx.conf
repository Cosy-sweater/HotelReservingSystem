server {
    listen 80;
    root /usr/share/nginx/html;

    absolute_redirect off;
    port_in_redirect off;

    # 1. GLOBAL STATIC FILES (/css/..., /js/..., /styles/..., /scripts/...)
    location /css/ { try_files $uri =404; }
    location /js/ { try_files $uri =404; }
    location /styles/ { try_files $uri =404; }
    location /scripts/ { try_files $uri =404; }

    location = /favicon.ico {
        try_files /favicon.ico =404;
        log_not_found off;
        access_log off;
    }

    # 2. Public Login Page
    location = /login {
        try_files /login.html =404;
    }

    # Normalize /admin to /admin/ so relative links (like "styles/admin.css") work properly
    location = /admin {
        return 302 /admin/;
    }

    # 3. SERVER-PROTECTED ADMIN PANEL & ADMIN ASSETS (/admin/styles/..., /admin/scripts/...)
    location /admin/ {
        auth_request /_verify_admin;
        error_page 401 = @redirect_login;
        error_page 403 = @forbidden_page;
        # Serve exact file (e.g. /admin/styles/main.css), or .html, or directory index, else 404!
        try_files $uri $uri.html $uri/index.html =404;
    }

    # 4. Protected Guest Portal & Guest Assets
    # Supports BOTH "/styles/guest.css" AND "/guest/styles/guest.css"
    location / {
        auth_request /_verify_user;
        error_page 401 = @redirect_login;
        try_files $uri $uri.html /guest$uri /guest$uri.html /guest$uri/index.html =404;
    }

    # 5. Proxy Auth Requests to Container 3 (auth-service)
    location /auth/ {
        proxy_pass http://auth-service:5001/auth/;
        proxy_set_header Host $http_host;
        proxy_set_header Cookie $http_cookie;
    }

    # 6. Proxy Hotel API Requests to Container 4 (backend)
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_set_header Host $http_host;
        proxy_set_header Cookie $http_cookie;
    }

    # --- Internal Subrequests used by Nginx auth_request ---
    location = /_verify_user {
        internal;
        proxy_pass http://auth-service:5001/auth/verify-user;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location = /_verify_admin {
        internal;
        proxy_pass http://auth-service:5001/auth/verify-admin;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location @redirect_login {
        return 302 /login;
    }

    location @forbidden_page {
        default_type text/html;
        return 403 "<h1>403 Forbidden: Admin privileges required.</h1><a href='/'>Return to Guest Portal</a>";
    }
}